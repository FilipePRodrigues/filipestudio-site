    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Quanto tempo leva pra fazer um site?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Depende do tamanho. Landing page sai em 7 a 10 dias úteis. Site institucional leva de 2 a 4 semanas. Projeto customizado, de 4 a 8 semanas. Depois do briefing você recebe um cronograma fechado."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona o pagamento?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Em etapas, sem susto: normalmente 40% na aprovação, 30% na entrega do design e 30% na publicação. Aceito Pix, transferência e cartão. Projeto maior? A gente combina um plano que cabe no seu bolso."
            }
          },
          {
            "@type": "Question",
            "name": "O site vai ficar bom no celular?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Com certeza. Todo projeto é mobile-first e testado em vários aparelhos. Experiência no celular é prioridade — é de lá que vem a maior parte do tráfego."
            }
          },
          {
            "@type": "Question",
            "name": "Você faz os textos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ajudando com copy orientada a conversão, sim. Se preferir, também trampo com redator especializado. O ideal é você trazer o material da marca (textos, fotos, logo) e eu traduzo isso em uma experiência que vende."
            }
          },
          {
            "@type": "Question",
            "name": "Tem suporte depois da entrega?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tem. Todos os planos incluem suporte pós-lançamento (de 30 a 90 dias, conforme o plano) pra correções e ajustes. E tem plano mensal de manutenção se você quiser ficar tranquilo."
            }
          },
          {
            "@type": "Question",
            "name": "Você atende fora de BH?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim! Trampo 100% remoto com clientes de qualquer lugar do Brasil (e do exterior). Comunicação por WhatsApp, e-mail e videochamada — clara e organizada."
            }
          }
        ]
      }
